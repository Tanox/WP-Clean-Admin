<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="WP Clean Admin 横幅">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="980" cy="50" r="170" fill="#ffffff" opacity="0.06"/>
  <circle cx="1130" cy="350" r="120" fill="#34d399" opacity="0.12"/>

  <!-- 标题区 -->
  <text x="70" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#ffffff">WP Clean Admin</text>
  <text x="72" y="170" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#cbd5e1">让 WordPress 后台更简洁、更快、更安全</text>

  <!-- 标签 -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0">
    <rect x="70" y="208" width="138" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <circle cx="94" cy="231" r="6" fill="#34d399"/>
    <text x="112" y="236">简洁清爽</text>

    <rect x="220" y="208" width="138" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <circle cx="244" cy="231" r="6" fill="#60a5fa"/>
    <text x="262" y="236">极速性能</text>

    <rect x="370" y="208" width="138" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <circle cx="394" cy="231" r="6" fill="#fb7185"/>
    <text x="412" y="236">安全可靠</text>
  </g>

  <!-- 模拟后台面板 -->
  <rect x="700" y="70" width="440" height="262" rx="16" fill="url(#card)" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="732" cy="98" r="10" fill="#6366f1"/>
  <rect x="750" y="92" width="92" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="1022" y="83" width="100" height="28" rx="14" fill="#d1fae5"/>
  <text x="1072" y="101" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#059669">已清理 12 项</text>
  <line x1="700" y1="124" x2="1140" y2="124" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 侧边栏 -->
  <rect x="716" y="140" width="104" height="176" rx="8" fill="#f8fafc"/>
  <rect x="720" y="176" width="96" height="22" rx="6" fill="#e0e7ff"/>
  <rect x="728" y="158" width="72" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="728" y="208" width="72" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="728" y="230" width="72" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="728" y="252" width="72" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="728" y="274" width="72" height="10" rx="5" fill="#cbd5e1"/>

  <!-- 主区已清理项 -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b">
    <rect x="840" y="146" width="280" height="28" rx="6" fill="#f1f5f9"/>
    <circle cx="858" cy="160" r="7" fill="#34d399"/>
    <text x="874" y="165">冗余菜单项已隐藏</text>

    <rect x="840" y="186" width="280" height="28" rx="6" fill="#f1f5f9"/>
    <circle cx="858" cy="200" r="7" fill="#34d399"/>
    <text x="874" y="205">仪表盘小工具已移除</text>

    <rect x="840" y="226" width="280" height="28" rx="6" fill="#f1f5f9"/>
    <circle cx="858" cy="240" r="7" fill="#34d399"/>
    <text x="874" y="245">过期计划任务已清理</text>

    <rect x="840" y="266" width="280" height="28" rx="6" fill="#f1f5f9"/>
    <circle cx="858" cy="280" r="7" fill="#34d399"/>
    <text x="874" y="285">孤立元数据已优化</text>
  </g>
</svg>
