<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="WP Clean Admin 核心功能">
  <defs>
    <style>
      text { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 卡片 1 后台清理 -->
  <g transform="translate(8,20)">
    <rect width="224" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="112" cy="56" r="26" fill="#dbeafe"/>
    <g transform="translate(112,56)" fill="#3b82f6">
      <rect x="-13" y="-11" width="26" height="20" rx="3"/>
      <rect x="-13" y="-11" width="26" height="6" rx="3" fill="#ffffff"/>
    </g>
    <text x="112" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">后台清理</text>
    <text x="112" y="146" text-anchor="middle" font-size="13" fill="#64748b">菜单精简</text>
    <text x="112" y="168" text-anchor="middle" font-size="13" fill="#64748b">仪表盘优化</text>
  </g>

  <!-- 卡片 2 性能优化 -->
  <g transform="translate(248,20)">
    <rect width="224" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="112" cy="56" r="26" fill="#d1fae5"/>
    <path transform="translate(112,56)" d="M2,-13 L-9,3 L-1,3 L-4,14 L9,-4 L1,-4 Z" fill="#10b981"/>
    <text x="112" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">性能优化</text>
    <text x="112" y="146" text-anchor="middle" font-size="13" fill="#64748b">资源压缩</text>
    <text x="112" y="168" text-anchor="middle" font-size="13" fill="#64748b">心跳控制</text>
  </g>

  <!-- 卡片 3 安全增强 -->
  <g transform="translate(488,20)">
    <rect width="224" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="112" cy="56" r="26" fill="#ffe4e6"/>
    <path transform="translate(112,56)" d="M0,-13 L12,-8 V4 C12,11 0,15 0,15 C0,15 -12,11 -12,4 V-8 Z" fill="#f43f5e"/>
    <text x="112" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">安全增强</text>
    <text x="112" y="146" text-anchor="middle" font-size="13" fill="#64748b">隐藏版本</text>
    <text x="112" y="168" text-anchor="middle" font-size="13" fill="#64748b">登录保护</text>
  </g>

  <!-- 卡片 4 菜单定制 -->
  <g transform="translate(728,20)">
    <rect width="224" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="112" cy="56" r="26" fill="#fef3c7"/>
    <g transform="translate(112,56)" fill="#f59e0b">
      <rect x="-12" y="-10" width="16" height="4" rx="2"/>
      <rect x="-12" y="-1" width="16" height="4" rx="2"/>
      <rect x="-12" y="8" width="16" height="4" rx="2"/>
    </g>
    <text x="112" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">菜单定制</text>
    <text x="112" y="146" text-anchor="middle" font-size="13" fill="#64748b">角色权限</text>
    <text x="112" y="168" text-anchor="middle" font-size="13" fill="#64748b">菜单排序</text>
  </g>

  <!-- 卡片 5 数据库管理 -->
  <g transform="translate(968,20)">
    <rect width="224" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="112" cy="56" r="26" fill="#ede9fe"/>
    <g transform="translate(112,56)" fill="#8b5cf6">
      <ellipse cx="0" cy="-9" rx="11" ry="4"/>
      <path d="M-11,-9 V9 C-11,12 11,12 11,9 V-9" fill="none" stroke="#8b5cf6" stroke-width="3"/>
      <path d="M-11,0 C-11,3 11,3 11,0" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    </g>
    <text x="112" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">数据库管理</text>
    <text x="112" y="146" text-anchor="middle" font-size="13" fill="#64748b">一键优化</text>
    <text x="112" y="168" text-anchor="middle" font-size="13" fill="#64748b">备份恢复</text>
  </g>
</svg>
