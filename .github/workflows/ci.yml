name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    name: PHP Syntax Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint PHP files
        # php -l catches parse errors across the whole plugin tree.
        # Failures are re-emitted as ::error:: annotations so the details are
        # retrievable via the public check-run API (raw logs need admin auth).
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out="$(php -l "$f" 2>&1)" || { status=1; echo "::error file=$f::$out"; }
          done < <( find wpcleanadmin -type f -name '*.php' -print0 )
          exit $status

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    # Mark non-blocking until the ruleset is tuned against the codebase.
    # Remove `continue-on-error` once the reported issues are triaged.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Install dependencies
        working-directory: wpcleanadmin
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Register coding standards
        working-directory: wpcleanadmin
        run: vendor/bin/phpcs --config-set installed_paths "$(pwd)/vendor/wp-coding-standards/wpcs,$(pwd)/vendor/phpcsstandards/phpcsutils,$(pwd)/vendor/phpcsstandards/phpcsextra"
      - name: Run phpcs
        working-directory: wpcleanadmin
        # Mirror the head of the report into ::error:: annotations (public
        # check-run API readable).
        run: |
          vendor/bin/phpcs > /tmp/phpcs.log 2>&1; s=$?
          if [ $s -ne 0 ]; then
            head -n 50 /tmp/phpcs.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $s

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
      - name: Install dependencies
        working-directory: wpcleanadmin
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        working-directory: wpcleanadmin
        # On failure, mirror the tail of the output into ::error:: annotations
        # so the details are retrievable via the public check-run API (raw
        # logs need admin auth).
        run: |
          composer test > /tmp/test.log 2>&1; s=$?
          if [ $s -ne 0 ]; then
            tail -n 30 /tmp/test.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $s
