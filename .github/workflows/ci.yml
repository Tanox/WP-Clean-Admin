name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    name: PHP Syntax Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint PHP files
        # php -l catches parse errors across the whole plugin tree.
        # Use an explicit loop instead of `find | xargs` to fail fast on the
        # first parse error and avoid any xargs edge cases (exit 124 timeout).
        # Output is mirrored into $GITHUB_STEP_SUMMARY so failure details stay
        # retrievable via the public check-run API (raw logs need admin auth).
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <( find wpcleanadmin -type f -name '*.php' -print0 ) >> "$GITHUB_STEP_SUMMARY" 2>&1
          exit $status

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    # Mark non-blocking until the ruleset is tuned against the codebase.
    # Remove `continue-on-error` once the reported issues are triaged.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Install dependencies
        working-directory: wpcleanadmin
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Register coding standards
        working-directory: wpcleanadmin
        run: vendor/bin/phpcs --config-set installed_paths "$(pwd)/vendor/wp-coding-standards/wpcs,$(pwd)/vendor/phpcsstandards/phpcsutils,$(pwd)/vendor/phpcsstandards/phpcsextra"
      - name: Run phpcs
        working-directory: wpcleanadmin
        # Mirror output into the step summary (public check-run API readable)
        run: vendor/bin/phpcs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
      - name: Install dependencies
        working-directory: wpcleanadmin
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        working-directory: wpcleanadmin
        # Mirror output into the step summary so failure details stay
        # retrievable via the public check-run API without admin log access.
        run: composer test 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
