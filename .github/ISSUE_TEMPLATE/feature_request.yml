name: 功能建议（Feature Request）
description: 为 WP Clean Admin 提出新功能或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！清晰的需求描述能帮助我们评估与排期。
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 当前缺少什么能力，或遇到了什么不便？
      placeholder: 例如：目前无法按文件大小阈值批量清理媒体库
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望新增或改进的功能是什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 截图、参考链接、适用场景等
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认该功能未被重复提出
          required: true
        - label: 该功能与 WP Clean Admin 的后台清理/优化定位一致
          required: false
